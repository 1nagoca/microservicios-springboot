spring.application.name=pedidos
server.port=8082

# Base de datos propia de este servicio (en memoria)
spring.datasource.url=jdbc:h2:mem:pedidos
spring.jpa.show-sql=true

# Mostrar el mensaje de error en las respuestas
# (en Spring Boot 4 reemplaza a server.error.include-message, que está deprecada)
spring.web.error.include-message=always

# Dónde está el servicio de Catálogo
catalogo.url=http://localhost:8081
